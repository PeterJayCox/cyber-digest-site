<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600">
  <defs>
    <linearGradient id="bg-fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4f8ff"/>
      <stop offset="100%" stop-color="#eef4fd"/>
    </linearGradient>
    <radialGradient id="hero-glow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#00b4d8" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#0072f5" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grid-fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0072f5" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0072f5" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="600" fill="url(#bg-fade)"/>
  <!-- Radial Glow -->
  <rect width="1600" height="600" fill="url(#hero-glow)"/>

  <!-- Subtle Perspective Grid -->
  <g stroke="url(#grid-fade)" stroke-width="1">
    <line x1="0" y1="100" x2="1600" y2="100"/>
    <line x1="0" y1="180" x2="1600" y2="180"/>
    <line x1="0" y1="280" x2="1600" y2="280"/>
    <line x1="0" y1="400" x2="1600" y2="400"/>
    <line x1="0" y1="540" x2="1600" y2="540"/>
    <!-- Vertical Radar Grid -->
    <line x1="200" y1="0" x2="200" y2="600" stroke-dasharray="4 4"/>
    <line x1="500" y1="0" x2="500" y2="600" stroke-dasharray="4 4"/>
    <line x1="800" y1="0" x2="800" y2="600"/>
    <line x1="1100" y1="0" x2="1100" y2="600" stroke-dasharray="4 4"/>
    <line x1="1400" y1="0" x2="1400" y2="600" stroke-dasharray="4 4"/>
  </g>

  <!-- Central Radar Telemetry Overlay -->
  <g transform="translate(800, 260)" stroke="#0072f5" fill="none" opacity="0.34">
    <circle r="120" stroke-width="1.5" stroke-dasharray="8 4"/>
    <circle r="220" stroke-width="1"/>
    <circle r="340" stroke-width="1" stroke-dasharray="2 6"/>
    <!-- Sweep Arc -->
    <path d="M 0 0 L 240 -120 A 260 260 0 0 1 260 0 Z" fill="#00b4d8" fill-opacity="0.07" stroke="none"/>
    <!-- Telemetry Points -->
    <circle cx="160" cy="-80" r="4" fill="#00b4d8" stroke="none"/>
    <circle cx="-180" cy="120" r="3" fill="#0072f5" stroke="none"/>
    <circle cx="210" cy="90" r="3.5" fill="#00b4d8" stroke="none"/>
    <circle cx="-120" cy="-140" r="2.5" fill="#0072f5" stroke="none"/>
  </g>
</svg>