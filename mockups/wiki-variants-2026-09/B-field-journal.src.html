<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8">
<title>Variant B — Field Journal · Cyber Wiki mockup</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e1a;--surface:#111827;--surface2:#1a2332;--hover:#1e293b;
  --text:#e2e8f0;--sec:#b0c0d0;--muted:#8a9cb6;--dim:#64748b;
  --border:rgba(255,255,255,.06);--border2:rgba(255,255,255,.11);
  --accent:#00b4d8;--glow:rgba(0,180,216,.08);
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --serif:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;font-size:15px}
a{color:var(--accent);text-decoration:none}
.mk{position:fixed;right:14px;bottom:14px;z-index:99;font:600 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);background:var(--surface);border:1px solid var(--border2);padding:7px 11px;border-radius:999px}
.topnav{position:sticky;top:0;z-index:50;background:rgba(10,14,26,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.topnav .in{max-width:1360px;margin:0 auto;padding:12px 26px;display:flex;align-items:center;gap:10px}
.brand{font-size:17px;font-weight:700;letter-spacing:-.4px;display:flex;align-items:center;gap:10px}
.brand .dot{width:12px;height:12px;border-radius:50%;background:var(--accent)}
.brand small{font:400 11px/1 Inter;color:var(--dim);letter-spacing:1.2px;text-transform:uppercase}
.nav{margin-left:auto;display:flex;gap:2px}
.nav a{color:var(--muted);font-size:14px;font-weight:500;padding:8px 13px;border-radius:6px}
.nav a:hover{color:var(--text);background:var(--surface2)}
.nav a.on{color:var(--text);background:var(--hover);font-weight:600}
.wrap{max-width:1360px;margin:0 auto;padding:0 26px 90px}
/* masthead */
.mast{padding:44px 0 26px;border-bottom:2px solid var(--border2)}
.mast .kick{font:500 11px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--accent)}
.mast h1{font-family:var(--serif);font-size:44px;line-height:1.1;font-weight:600;letter-spacing:-1px;margin:12px 0 10px}
.mast h1 em{font-style:italic;color:var(--accent)}
.mast .lede{font-family:var(--serif);font-size:19px;line-height:1.6;color:var(--sec);max-width:760px}
.mast .rule{display:flex;gap:28px;margin-top:20px;flex-wrap:wrap;font:500 11.5px/1.6 var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.09em}
.mast .rule b{color:var(--text);font-weight:600}
/* filter bar */
.bar{position:sticky;top:57px;z-index:40;background:rgba(10,14,26,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:11px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font:500 12px/1 Inter;padding:7px 13px;border-radius:999px;background:var(--surface);border:1px solid var(--border2);color:var(--muted);cursor:pointer}
.pill:hover{color:var(--text)}
.pill.on{background:rgba(0,180,216,.14);border-color:var(--accent);color:#a5e9f7}
.bar .search{margin-left:auto;position:relative}
.bar input{background:var(--surface);border:1px solid var(--border2);border-radius:999px;color:var(--text);font:inherit;font-size:13px;padding:8px 15px;width:230px;outline:none}
.bar input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.bar .n{font:500 11.5px/1 var(--mono);color:var(--dim)}
/* layout */
.cols{display:grid;grid-template-columns:minmax(0,1fr) 322px;gap:44px;align-items:start;margin-top:26px}
/* stream */
.day{margin-bottom:6px}
.dayhead{display:flex;align-items:baseline;gap:12px;padding:20px 0 8px;border-top:1px solid var(--border);cursor:pointer}
.dayhead:hover h3{color:var(--accent)}
.dayhead h3{font-family:var(--serif);font-size:23px;font-weight:600;letter-spacing:-.3px}
.dayhead .wd{font:500 11px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.dayhead .cnt{margin-left:auto;font:500 11px/1 var(--mono);color:var(--dim);background:var(--surface2);padding:4px 9px;border-radius:999px}
.ent{display:grid;grid-template-columns:96px minmax(0,1fr);gap:18px;padding:14px 0 14px 0;border-bottom:1px solid var(--border)}
.ent:hover{background:linear-gradient(90deg,rgba(0,180,216,.05),transparent)}
.ent .meta{font:500 11px/1.5 var(--mono);color:var(--dim);padding-top:3px}
.ent .meta .bar2{display:block;width:26px;height:2px;background:var(--accent);opacity:.5;margin-bottom:7px}
.ent h4{font-size:17px;font-weight:600;line-height:1.35;letter-spacing:-.25px;cursor:pointer}
.ent h4:hover{color:var(--accent)}
.ent p{color:var(--muted);font-size:14px;line-height:1.6;margin-top:5px}
.ent .tags{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.tag{font:500 10.5px/1 var(--mono);color:var(--muted);background:var(--surface2);border:1px solid var(--border);padding:3px 7px;border-radius:4px;cursor:pointer}
.tag:hover{color:var(--accent);border-color:var(--accent)}
.badge{font:600 9.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:3px 6px;border-radius:4px;margin-left:7px;vertical-align:2px}
.b-new{color:#a5f3fc;background:rgba(0,180,216,.16);border:1px solid rgba(0,180,216,.4)}
.b-upd{color:#fed7aa;background:rgba(251,146,60,.14);border:1px solid rgba(251,146,60,.4)}
.b-au{color:#bbf7d0;background:rgba(74,222,128,.12);border:1px solid rgba(74,222,128,.32)}
/* rail */
.rail{position:sticky;top:126px;display:grid;gap:20px}
.card{border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:18px}
.card h4{font:600 10.5px/1 var(--mono);letter-spacing:.15em;text-transform:uppercase;color:var(--dim);margin-bottom:13px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.primer{display:grid;gap:13px}
.primer a{font-size:14px;color:var(--text);line-height:1.4;display:block}
.primer a:hover{color:var(--accent)}
.primer small{display:block;font-size:12.5px;color:var(--muted);font-weight:400;line-height:1.5;margin-top:3px}
.primer .who{font:500 10px/1 var(--mono);color:var(--accent);text-transform:uppercase;letter-spacing:.1em}
.cloud{display:flex;flex-wrap:wrap;gap:6px}
.tstat{display:grid;gap:9px}
.tstat div{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--sec)}
.tstat i{width:7px;height:7px;border-radius:2px;flex-shrink:0}
.tstat b{margin-left:auto;font:500 11.5px/1 var(--mono);color:var(--dim)}
.track{height:4px;background:var(--surface2);border-radius:999px;overflow:hidden;margin-left:10px;width:74px}
.track span{display:block;height:100%;background:var(--accent);opacity:.65}
/* article */
.article{display:none}
.article.on{display:block}
.stream.off{display:none}
.crumb{font:500 12px/1 var(--mono);color:var(--dim);margin-bottom:18px}
.crumb button{background:none;border:0;color:var(--accent);font:inherit;cursor:pointer;padding:0}
.article .dateline{font:500 11.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.article h1{font-family:var(--serif);font-size:40px;line-height:1.14;font-weight:600;letter-spacing:-.8px;margin:12px 0 14px}
.article .byline{display:flex;gap:9px;flex-wrap:wrap;align-items:center;padding-bottom:16px;border-bottom:1px solid var(--border)}
.article .body{font-family:var(--serif);font-size:18.5px;line-height:1.78;color:var(--sec);margin-top:20px}
.article .body p{margin-bottom:16px}
.article .body p:first-child::first-letter{float:left;font-size:58px;line-height:.86;padding:6px 10px 0 0;color:var(--accent);font-weight:600}
.article h2{font-family:Inter;font-size:16px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:28px 0 10px;padding-top:16px;border-top:1px solid var(--border)}
.pull{border-left:2px solid var(--accent);padding:4px 0 4px 18px;margin:22px 0;font-family:var(--serif);font-size:20px;line-height:1.6;color:var(--text)}
.srclist{list-style:none;display:grid;gap:8px}
.srclist li{font-size:14.5px;color:var(--muted)}
.srclist li::before{content:"↗ ";color:var(--dim)}
.next{margin-top:34px;padding-top:18px;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:20px}
.next a{max-width:46%}
.next small{display:block;font:500 10px/1 var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--dim);margin-bottom:5px}
.next span{font-size:14.5px;color:var(--sec)}
.next a:hover span{color:var(--accent)}
.empty{padding:50px 0;color:var(--dim);font-family:var(--serif);font-size:19px}
</style></head>
<body>
<div class="topnav"><div class="in">
  <div class="brand"><span class="dot"></span>Cyber Digest <small>Public site</small></div>
  <nav class="nav"><a href="#">Home</a><a href="#">Story DB</a><a href="#">Globe</a><a href="#">Reports</a><a class="on" href="#">Wiki</a><a href="#">Tools</a></nav>
</div></div>

<div class="wrap">
  <header class="mast">
    <div class="kick">The file · continuously updated</div>
    <h1>Cyber Wiki — <em>read it as it happened</em></h1>
    <p class="lede" id="mastLede"></p>
    <div class="rule" id="mastRule"></div>
  </header>

  <div class="stream" id="stream">
    <div class="bar" id="bar">
      <button class="pill on" data-f="all">Everything</button>
      <button class="pill" data-f="today">New today</button>
      <button class="pill" data-f="au">Australian impact</button>
      <button class="pill" data-f="critical">Critical severity</button>
      <button class="pill" data-f="escal">Escalated since filing</button>
      <span class="n" id="barN"></span>
      <div class="search"><input id="q" placeholder="Search the file…" autocomplete="off"></div>
    </div>
    <div class="cols">
      <main id="days"></main>
      <aside class="rail" id="rail"></aside>
    </div>
  </div>

  <article class="article" id="article"></article>
</div>
<div class="mk">Mockup B · Field Journal</div>
<script>/*__WIKI_DATA__*/</script>
<script>
const D = window.WIKI;
const KIND={incident:'Incident',cve:'Vulnerability',entity:'Entity',concept:'Concept'};
const COL={incident:'#f97316',cve:'#a78bfa',entity:'#22d3ee',concept:'#34d399'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TODAY=D.items[0]?D.items[0].created:'';
const state={f:'all',q:''};
const longDate=d=>{const dt=new Date(d+'T09:00:00');return dt.toLocaleString('en-AU',{day:'numeric',month:'long',year:'numeric'})};
const weekDay=d=>new Date(d+'T09:00:00').toLocaleString('en-AU',{weekday:'long'});

function keep(p){
  if(state.f==='today' && p.created!==TODAY) return false;
  if(state.f==='au' && !p.au) return false;
  if(state.f==='critical' && p.severity!=='critical') return false;
  if(state.f==='escal' && !p.sections.some(s=>/escalat|update/i.test(s))) return false;
  if(state.q){const hay=(p.title+' '+p.summary+' '+p.tags.join(' ')).toLowerCase();
    if(!state.q.split(/\s+/).every(t=>hay.includes(t))) return false;}
  return true;
}
function renderStream(){
  const list=D.items.filter(keep);
  document.getElementById('barN').textContent=`${list.length} entries shown`;
  const byDay=new Map();
  list.forEach(p=>{if(!byDay.has(p.created))byDay.set(p.created,[]);byDay.get(p.created).push(p)});
  const days=[...byDay.entries()].map(([d,items])=>`
    <section class="day">
      <div class="dayhead"><h3>${longDate(d)}</h3><span class="wd">${weekDay(d)}</span>
        <span class="cnt">${items.length} ${items.length===1?'entry':'entries'}</span></div>
      ${items.map(p=>`
        <div class="ent">
          <div class="meta"><span class="bar2"></span>${KIND[p.k]}<br>${esc(p.confidence||'—')} conf.</div>
          <div>
            <h4 data-slug="${esc(p.slug)}">${esc(p.title)}${p.created===TODAY?'<span class="badge b-new">new</span>':''}${p.updated!==p.created?'<span class="badge b-upd">revised</span>':''}${p.au?'<span class="badge b-au">AU</span>':''}</h4>
            <p>${esc(p.summary.slice(0,190))}${p.summary.length>190?'…':''}</p>
            <div class="tags">${p.tags.slice(0,5).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
          </div>
        </div>`).join('')}
    </section>`).join('');
  document.getElementById('days').innerHTML = days || `<div class="empty">Nothing in the file matches that.</div>`;
}
function renderRail(){
  const cpts=(D.concepts||[]).slice(0,3), ents=(D.entities||[]).slice(0,3);
  document.getElementById('rail').innerHTML=`
    <div class="card"><h4>Standing reference</h4><div class="primer">
      <div class="who">Concepts · ${D.counts.concept} in the file</div>
      ${cpts.map(p=>`<a href="#" data-slug="${esc(p.slug)}">${esc(p.title)}<small>${esc(p.summary.slice(0,105))}…</small></a>`).join('')}
      <div class="who" style="margin-top:6px">Entities · ${D.counts.entity} in the file</div>
      ${ents.map(p=>`<a href="#" data-slug="${esc(p.slug)}">${esc(p.title)}<small>${p.mentions} other entr${p.mentions===1?'y':'ies'} name this actor</small></a>`).join('')}
    </div></div>
    <div class="card"><h4>Subjects recurring in the file</h4><div class="cloud">
      ${D.tags.slice(0,18).map(([t,n])=>`<span class="tag" data-q="${esc(t)}" style="font-size:${11+(n%4)}px">${esc(t)} · ${n}</span>`).join('')}
    </div></div>
    <div class="card"><h4>What's in the file</h4><div class="tstat">
      ${Object.entries(D.counts).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<div><i style="background:${COL[k]}"></i>${KIND[k]}s<b>${n}</b><span class="track"><span style="width:${Math.round(n/D.counts.incident*100)}%"></span></span></div>`).join('')}
      <div><i style="background:#4ade80"></i>AU-relevant<b>${D.au}</b></div>
      <div><i style="background:#f43f5e"></i>Critical severity<b>${D.severity.critical||0}</b></div>
    </div></div>
    <div class="card"><h4>Running threads</h4><div class="primer">
      ${D.threads.slice(0,4).map(t=>`<a href="#" data-q="${esc(t.name)}">${esc(t.name)}<small>${t.total} entries across the file${t.by.entity?` · ${t.by.entity} entity page`:''}</small></a>`).join('')}
    </div></div>`;
}
function openArticle(slug){
  const p=D.items.find(x=>x.slug===slug); if(!p) return;
  const i=D.items.indexOf(p), prev=D.items[i+1], next=D.items[i-1];
  document.getElementById('stream').classList.add('off');
  const a=document.getElementById('article'); a.classList.add('on');
  const related=D.items.filter(x=>x!==p && x.tags.some(t=>p.tags.includes(t))).slice(0,4);
  a.innerHTML=`
    <div class="crumb"><button id="back">← The whole file</button> · ${KIND[p.k]} · updated ${p.updated||p.created}</div>
    <div class="dateline">${longDate(p.created)} · ${esc(p.sectors.join(' · ')||'sector not recorded')}</div>
    <h1>${esc(p.title)}</h1>
    <div class="byline">
      ${p.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}
      ${p.au?'<span class="badge b-au">Australian impact</span>':''}
      ${p.updated!==p.created?'<span class="badge b-upd">revised '+p.updated+'</span>':''}
    </div>
    <div class="body">
      <p>${esc(p.summary)}</p>
      <p>Confidence in this entry is recorded as <strong>${esc(p.confidence||'not rated')}</strong>${p.severity?`, severity <strong>${esc(p.severity)}</strong>`:''}. It is one of ${D.total} pages in the open file and links onward to ${p.nlinks} source${p.nlinks===1?'':'s'}.</p>
    </div>
    ${p.sections.length?`<h2>${esc(p.sections[0])}</h2><p class="pull">${esc(p.sections[0])} — the section as the vault holds it, rendered inside the reading measure rather than a card.</p>`:''}
    ${p.sections.slice(1).map(s=>`<h2>${esc(s)}</h2>`).join('')}
    <h2>Sources</h2>
    <ul class="srclist">${(p.links.length?p.links:['Source link']).map(l=>`<li>${esc(l)}</li>`).join('')}</ul>
    ${related.length?`<h2>Elsewhere in the file</h2><ul class="srclist">${related.map(r=>`<li><a href="#" data-slug="${esc(r.slug)}">${esc(r.title)}</a></li>`).join('')}</ul>`:''}
    <div class="next">
      ${prev?`<a href="#" data-slug="${esc(prev.slug)}"><small>Later in the file</small><span>${esc(prev.title)}</span></a>`:'<span></span>'}
      ${next?`<a href="#" data-slug="${esc(next.slug)}" style="text-align:right"><small>Earlier in the file</small><span>${esc(next.title)}</span></a>`:'<span></span>'}
    </div>`;
  window.scrollTo({top:0,behavior:'instant'});
  document.getElementById('back').onclick=()=>{a.classList.remove('on');document.getElementById('stream').classList.remove('off')};
}
document.addEventListener('click',e=>{
  const p=e.target.closest('.pill[data-f]');
  if(p){state.f=p.dataset.f;document.querySelectorAll('.pill[data-f]').forEach(x=>x.classList.toggle('on',x===p));renderStream();return}
  const t=e.target.closest('[data-q]');
  if(t){state.q=t.dataset.q.toLowerCase();document.getElementById('q').value=t.dataset.q;renderStream();window.scrollTo({top:0,behavior:'instant'});return}
  const day=e.target.closest('.dayhead');
  if(day){const s=day.nextElementSibling;const hid=s.style.display==='none';s.style.display=hid?'':'none';return}
  const link=e.target.closest('[data-slug]');
  if(link){e.preventDefault();openArticle(link.dataset.slug)}
});
document.getElementById('q').addEventListener('input',e=>{state.q=e.target.value.toLowerCase();renderStream()});
document.getElementById('mastLede').textContent =
  `${D.total} entries, written as the reporting came in — ${D.counts.incident} incidents and campaigns, ${D.counts.cve} vulnerabilities, ${D.counts.entity} entities and ${D.counts.concept} concepts, each one a page you can read end to end.`;
document.getElementById('mastRule').innerHTML =
  `<span>Shelf: <b>Jul 2026 → Sep 2026</b></span><span>Last revised <b>${D.updated_max}</b></span><span>Australian impact on <b>${D.au}</b> entries</span><span>Open, no account</span><span style="color:var(--dim)">Mockup: newest 45 of ${D.total} loaded</span>`;
renderStream();renderRail();
</script>
</body></html>
