name: Integrity Gates & Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v5.1.0
        with:
          python-version: "3.11"

      - name: Verify CSS references
        run: |
          if [ -f "scripts/verify_css_refs.py" ]; then
            python3 scripts/verify_css_refs.py
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4.0.3
        with:
          node-version: "20"

      - name: Verify StoryDB Boolean Logic
        run: |
          if [ -f "scripts/verify_storydb_boolean.js" ]; then
            node scripts/verify_storydb_boolean.js
          fi
